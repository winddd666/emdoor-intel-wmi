# Emdoor Intel EWMI (emdoor-wmi) module options.
#
# All write capabilities default to disabled (0 / read-only mode).
# Uncomment only the explicit opt-in flags you have verified and want active.
#
#   allow_writes=1            Register platform_profile (balanced / performance)
#   allow_lock_writes=1       Make fn_lock and win_lock writable (0644)
#   allow_autopower_writes=1  Make auto_power_on writable (0644)
#
# Example (keep all lines commented by default for read-only safety):
# options emdoor_wmi allow_writes=1 allow_lock_writes=1 allow_autopower_writes=1
